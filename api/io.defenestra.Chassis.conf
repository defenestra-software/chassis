<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the Chassis service -->
  <policy user="root">
    <allow own="io.defenestra.Chassis"/>
  </policy>

  <!-- Any user can call methods (Polkit can be added later for fine-grained control) -->
  <policy context="default">
    <allow send_destination="io.defenestra.Chassis"/>
    <allow receive_sender="io.defenestra.Chassis"/>
  </policy>
</busconfig>
