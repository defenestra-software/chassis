app-id: io.defenestra.Chassis
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang

command: startup.sh

finish-args:
  # GUI access
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

  # DBus session bus for GTK application registration
  - --socket=session-bus

  # For flatpak-spawn to install daemon
  - --talk-name=org.freedesktop.Flatpak

  # Access to system D-Bus for daemon communication
  - --socket=system-bus

  # Read-only access to sysfs for hardware scanning
  - --filesystem=/sys:ro

modules:
  # Flatbox - allows running daemon with Flatpak runtime but host access
  - name: flatbox
    buildsystem: simple
    build-commands:
      - install -Dm755 flatbox -t /app/bin/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/ilya-zlobintsev/flatbox/releases/download/v0.0.5/flatbox-Linux-musl-x86_64.tar.gz
        strip-components: 0
        sha256: 6d0abf8b5e553422c2d1c36b04f3b5e750ef9cef2366367d28aae7654f8e0171
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/ilya-zlobintsev/flatbox/releases/download/v0.0.5/flatbox-Linux-musl-arm64.tar.gz
        strip-components: 0
        sha256: af5cf366eb345bc5c9289e3d8d19b03371bf31ab1ea35548308a82ccacebde67

  # Chassis application
  - name: chassis
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      append-path: /usr/lib/sdk/golang/bin
      env:
        GOPATH: /tmp/go
        GOCACHE: /tmp/go-cache
        GOROOT: /usr/lib/sdk/golang
        GOTOOLCHAIN: local
    build-commands:
      # Strip go.mod patch version so the SDK's pinned Go toolchain (GOTOOLCHAIN=local) accepts it
      - sed -i 's/^go 1\.25\.[0-9]*/go 1.25/' go.mod

      # Build binaries with version ldflags
      - |
        VERSION=$(cat dist/.version 2>/dev/null || echo dev)
        VERSION_LDFLAGS="-X defenestra.io/chassis/internal/shared.Version=${VERSION}"
        echo "Building version: ${VERSION}"
        go build -ldflags "-s -w ${VERSION_LDFLAGS}" -o chassis ./cmd/chassis
        go build -ldflags "-s -w ${VERSION_LDFLAGS}" -o chassis-daemon ./cmd/chassis-daemon

      # Install binaries
      - install -Dm755 chassis /app/bin/chassis
      - install -Dm755 chassis-daemon /app/bin/chassis-daemon

      # Install startup scripts
      - install -Dm755 deploy/flatpak/startup.sh /app/bin/startup.sh
      - install -Dm755 deploy/flatpak/daemon.sh /app/bin/daemon.sh

      # Install desktop file and icons. PNG only: host appstreamcli compose
      # fails with file-read-error trying to rasterize the scalable SVG.
      - install -Dm644 deploy/flatpak/io.defenestra.Chassis.desktop /app/share/applications/io.defenestra.Chassis.desktop
      - install -Dm644 deploy/share/icons/hicolor/256x256/apps/io.defenestra.Chassis.png /app/share/icons/hicolor/256x256/apps/io.defenestra.Chassis.png
      - install -Dm644 deploy/share/icons/hicolor/128x128/apps/io.defenestra.Chassis.png /app/share/icons/hicolor/128x128/apps/io.defenestra.Chassis.png
      - install -Dm644 deploy/share/icons/hicolor/64x64/apps/io.defenestra.Chassis.png /app/share/icons/hicolor/64x64/apps/io.defenestra.Chassis.png
      - install -Dm644 deploy/share/icons/hicolor/48x48/apps/io.defenestra.Chassis.png /app/share/icons/hicolor/48x48/apps/io.defenestra.Chassis.png

      # Install AppStream metadata
      - install -Dm644 dist/io.defenestra.Chassis.metainfo.xml /app/share/metainfo/io.defenestra.Chassis.metainfo.xml

      # Install D-Bus policy and Polkit actions
      - install -Dm644 api/io.defenestra.Chassis.conf /app/share/dbus-1/system.d/io.defenestra.Chassis.conf
      - install -Dm644 api/io.defenestra.Chassis.policy /app/share/polkit-1/actions/io.defenestra.Chassis.policy

    sources:
      - type: dir
        path: ../..
